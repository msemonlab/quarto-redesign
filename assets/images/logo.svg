<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="logo-grad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0073CF"/>
      <stop offset="50%" stop-color="#00A3E0"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>
  <!-- Geometric Frame -->
  <rect x="4" y="4" width="40" height="40" rx="10" stroke="url(#logo-grad)" stroke-width="2.5" fill="none" opacity="0.9"/>
  <!-- Central Neural / System Node Architecture -->
  <circle cx="16" cy="16" r="3.5" fill="#0073CF" filter="url(#glow)"/>
  <circle cx="32" cy="16" r="3.5" fill="#00A3E0" filter="url(#glow)"/>
  <circle cx="16" cy="32" r="3.5" fill="#00A3E0" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="3.5" fill="#38BDF8" filter="url(#glow)"/>
  <circle cx="24" cy="24" r="4" fill="#FFFFFF" stroke="#0073CF" stroke-width="2" filter="url(#glow)"/>
  <!-- Connecting Synapses / Data Links -->
  <line x1="16" y1="16" x2="24" y2="24" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="16" x2="24" y2="24" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="32" x2="24" y2="24" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="24" y2="24" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="32" y2="16" stroke="url(#logo-grad)" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6"/>
  <line x1="16" y1="32" x2="32" y2="32" stroke="url(#logo-grad)" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6"/>
</svg>
